version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: research_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    networks:
      - research_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
    container_name: research_worker
    command: celery -A app.workers.celery_app worker --loglevel=info -Q research
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      phoenix:
        condition: service_healthy
    networks:
      - research_net

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: research_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    networks:
      - research_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6006/"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: research_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - research_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - research_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: research_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - research_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  research_net:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
